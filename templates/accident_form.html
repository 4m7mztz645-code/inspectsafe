{% extends "base.html" %}{% block title %}Accident Report - {{ride.name}}{% endblock %}{% block content %}<h1>Add Accident / Incident Report</h1><p>{{ride.name}}{% if ride.adips_id %} · ADIPS {{ride.adips_id}}{% endif %}</p><div class="card"><form method="post"><div class="grid"><div><label>Date</label><input type="date" name="incident_date" value="{{today}}" required></div><div><label>Time</label><input type="time" name="incident_time"></div><div><label>Location</label><input name="location"></div><div><label>Person involved</label><input name="person_name"></div><div><label>Contact details</label><input name="person_contact"></div><div><label>Reported to</label><input name="reported_to" placeholder="Manager / authority / insurer"></div></div><label>Incident description</label><textarea name="incident_description" rows="5" required></textarea><label>Injury details</label><textarea name="injury_details" rows="4"></textarea><label>Immediate action taken</label><textarea name="immediate_action" rows="4"></textarea><label>Witnesses / contact details</label><textarea name="witnesses" rows="3"></textarea><label class="tick"><input type="checkbox" name="ride_stopped"> Ride stopped / taken out of service</label><button class="primary">Save Accident Report</button></form></div>{% endblock %}
