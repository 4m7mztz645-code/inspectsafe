{% extends "base.html" %}{% block title %}Maintenance - {{ride.name}}{% endblock %}{% block content %}<h1>Add Maintenance Log</h1><p>{{ride.name}}{% if ride.adips_id %} · ADIPS {{ride.adips_id}}{% endif %}</p><div class="card"><form method="post"><div class="grid"><div><label>Date</label><input type="date" name="log_date" value="{{today}}" required></div><div><label>Category</label><select name="category"><option>Routine Maintenance</option><option>Repair</option><option>Defect</option><option>Adjustment</option><option>Inspection Follow-up</option><option>Other</option></select></div></div><label>Description / fault</label><textarea name="description" rows="4" required></textarea><label>Action taken</label><textarea name="action_taken" rows="4"></textarea><label>Parts used / replaced</label><textarea name="parts_used" rows="3"></textarea><label class="tick"><input type="checkbox" name="out_of_service"> Ride taken out of service</label><label class="tick"><input type="checkbox" name="returned_to_service"> Ride returned to service after work</label><button class="primary">Save Maintenance Log</button></form></div>{% endblock %}
